name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      # wrangler.jsonc must already have a real D1 database_id committed
      # (npm run d1:create, done once locally — see README). The Pages
      # project itself must also already exist (npm run deploy locally,
      # once, or `wrangler pages project create`) before this can deploy.
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=do-you-know-mauritius --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
